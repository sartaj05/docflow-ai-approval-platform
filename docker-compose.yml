services:
  db:
    image: postgres:16-alpine
    container_name: docflow_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - docflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docflow_web
    restart: unless-stopped
    env_file:
      - .env
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --access-logfile -
      --error-logfile -
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backup_volume:/app/media/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docflow_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docflow_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A config worker -l info
    volumes:
      - media_volume:/app/media
      - backup_volume:/app/media/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - docflow_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docflow_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - media_volume:/app/media
      - backup_volume:/app/media/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - docflow_network

  nginx:
    image: nginx:1.27-alpine
    container_name: docflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - docflow_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  backup_volume:

networks:
  docflow_network:
    driver: bridge